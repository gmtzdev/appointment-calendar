<div class="login-container">

  <div class="login-card">
    <!-- Header Section -->
    <div class="login-header">
      <div class="logo">
        <i class="logo-icon">🦷</i>
        <h1 class="app-title">Dental Admin</h1>
      </div>
      <p class="login-subtitle">Enter your email to reset your password</p>
    </div>

    <!-- Login Form -->
    <form [formGroup]="forgotPasswordForm" (ngSubmit)="onSubmit()" class="login-form">
      <!-- Email Field -->
      <div class="form-group">
        <label for="email" class="form-label">Email Address</label>
        <div class="input-wrapper">
          <i class="input-icon">📧</i>
          <input
            id="email"
            type="email"
            formControlName="email"
            class="form-input"
            [class.error]="hasFieldError('email', 'required') || hasFieldError('email', 'email')"
            placeholder="Enter your email address"
            autocomplete="email">
          </div>
          @if (getFieldErrorMessage('email')) {
            <div class="error-message">
              {{ getFieldErrorMessage('email') }}
            </div>
          }
        </div>


          <!-- Error Message -->
          @if (errorMessage) {
            <div class="alert error-alert">
              <i class="alert-icon">⚠️</i>
              <span>{{ errorMessage }}</span>
            </div>
          }

          <!-- Submit Button -->
          <button
            type="submit"
            class="login-button"
            [disabled]="isLoading || forgotPasswordForm.invalid"
            [class.loading]="isLoading">
            @if (!isLoading) {
              <span>Sign In</span>
            }
            @if (isLoading) {
              <span class="loading-content">
                <i class="loading-spinner"></i>
                Signing in...
              </span>
            }
          </button>
        </form>

        <!-- Footer Section -->
        <div class="login-footer">
          <p class="footer-text">
            Don't have access anymore?
            <a href="#" class="register-link">Contact administrator</a>
          </p>
          <div class="app-version">
            <small>Version 1.0.0</small>
          </div>
        </div>
    </div>

    <!-- Background Elements -->
    <div class="background-pattern">
        <div class="pattern-circle circle-1"></div>
        <div class="pattern-circle circle-2"></div>
        <div class="pattern-circle circle-3"></div>
    </div>
</div>
